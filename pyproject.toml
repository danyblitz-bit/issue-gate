[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-gate"
version = "1.0.0"
description = "GitHub issue forms that require a reproduction — stop low-effort issues at the door."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Danilo Fortunato" }]
keywords = [
    "github",
    "issues",
    "issue-forms",
    "triage",
    "maintainers",
    "open-source",
    "cli",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control :: Git",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://danyblitz-bit.github.io/issue-gate/"
Repository = "https://github.com/danyblitz-bit/issue-gate"
"Bug Tracker" = "https://github.com/danyblitz-bit/issue-gate/issues"

[project.scripts]
issuegate = "issuegate.__main__:main"

[tool.setuptools]
packages = ["issuegate"]

[tool.setuptools.package-dir]
issuegate = "."